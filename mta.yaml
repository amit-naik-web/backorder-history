- name: backorder-history-app
    type: approuter.nodejs
    path: app/backorder-ui
    parameters:
      disk-quota: 256M
      memory: 128M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: backorder-history-srv
          url: ~{srv-url}
          forwardAuthToken: true
      - name: srv-api
        group: destinations
        properties:
          name: ui5cdn
          url: https://ui5.sap.com
          forwardAuthToken: false
      - name: backorder-history-xsuaa