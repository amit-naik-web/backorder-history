_schema-version: 3.3.0
ID: backorder-history
description: BackOrder History App
version: 1.0.0

modules:
  - name: backorder-history-app
    type: staticfile
    path: app/backorder-ui
    parameters:
      buildpack: staticfile_buildpack
    build-parameters:
      no-source: false
    requires:
      - name: srv-api

  - name: backorder-history-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: backorder-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: backorder-history-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: backorder-db
    parameters:
      buildpack: nodejs_buildpack

  - name: backorder-history-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: backorder-history-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - backorderappbackorderui.zip
          name: backorderappbackorderui
          target-path: resources/

  - name: backorderappbackorderui
    type: html5
    path: app/backorder-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:
  - name: backorder-db
    type: com.sap.xs.hdi-container
    parameters:
      existing-service: dev_project-db
      service: hana
      service-plan: hdi-shared

  - name: backorder-history-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: backorder-history-html5-service
      service-plan: app-host

  - name: backorder-history-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-name: backorder-history-destination-service
      service-plan: lite
      config:
        HTML5Runtime_enabled: false
        version: 1.0.0
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: ui5
                URL: https://ui5.sap.com
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production